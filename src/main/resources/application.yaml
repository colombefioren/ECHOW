server:
  port: 8080
  servlet:
    context-path: /
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/echow
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    com.echow: DEBUG
    org.springframework.security: DEBUG